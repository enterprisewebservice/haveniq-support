# Zammad's database: the same sclorg Postgres image the newsdesks and Keycloak run on. The password is
# generated by External Secrets (never typed, never in git); Zammad reads the same Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: { name: zammad-postgresql-pass, namespace: haveniq }
spec: { length: 32, digits: 8, symbols: 0, symbolCharacters: "", noUpper: false, allowRepeat: true }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: postgresql-pass, namespace: haveniq }
spec:
  refreshInterval: "0"
  target:
    name: postgresql-pass
    creationPolicy: Owner
    template:
      data:
        postgresql-pass: "{{ .password }}"
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: zammad-postgresql-pass } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: zammad-postgresql-data, namespace: haveniq }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-postgresql
  namespace: haveniq
  labels: { app.kubernetes.io/name: zammad-postgresql, app.kubernetes.io/part-of: haveniq-support }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: zammad-postgresql } }
  template:
    metadata: { labels: { app.kubernetes.io/name: zammad-postgresql } }
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-16-c9s:latest
          env:
            - { name: POSTGRESQL_USER, value: zammad }
            - { name: POSTGRESQL_DATABASE, value: zammad_production }
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: postgresql-pass, key: postgresql-pass } }
            - { name: POSTGRESQL_MAX_CONNECTIONS, value: "200" }
          ports: [{ containerPort: 5432, name: postgresql }]
          volumeMounts: [{ name: data, mountPath: /var/lib/pgsql/data }]
          readinessProbe: { exec: { command: [sh, -c, "pg_isready -U zammad -d zammad_production"] }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "2", memory: 2Gi } }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: zammad-postgresql-data }
---
apiVersion: v1
kind: Service
metadata: { name: zammad-postgresql, namespace: haveniq }
spec:
  selector: { app.kubernetes.io/name: zammad-postgresql }
  ports: [{ name: postgresql, port: 5432, targetPort: 5432 }]
