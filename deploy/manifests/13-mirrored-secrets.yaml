# Credentials the HavenIQ services need that already exist elsewhere on the cluster are MIRRORED by
# External Secrets through a kubernetes-provider store (the pattern the newsdesk uses for its gateway
# token): a ServiceAccount in this namespace is granted `get` on exactly the named Secrets in the source
# namespace, and ESO renders copies here. Nothing is typed or pasted anywhere.
#   model-desk-agent-key   (agent-office)  → the model desk key the voice worker uses for its turns
#   mattermost-admin-token (agent-office)  → lets the CRM bridge page the support channel
#   quay-push-rhdh         (upstreambeat)  → lets the in-cluster builds push to Quay
apiVersion: v1
kind: ServiceAccount
metadata: { name: secret-mirror, namespace: haveniq }
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: { name: agent-office-store, namespace: haveniq }
spec:
  provider:
    kubernetes:
      remoteNamespace: agent-office
      server: { url: kubernetes.default, caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt } }
      auth: { serviceAccount: { name: secret-mirror } }
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: { name: upstreambeat-store, namespace: haveniq }
spec:
  provider:
    kubernetes:
      remoteNamespace: upstreambeat
      server: { url: kubernetes.default, caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt } }
      auth: { serviceAccount: { name: secret-mirror } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: model-desk-key, namespace: haveniq }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: SecretStore, name: agent-office-store }
  target: { name: model-desk-key, creationPolicy: Owner }
  data:
    - secretKey: api-key
      remoteRef: { key: model-desk-agent-key, property: api-key }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: mattermost-token, namespace: haveniq }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: SecretStore, name: agent-office-store }
  target: { name: mattermost-token, creationPolicy: Owner }
  data:
    - secretKey: token
      remoteRef: { key: mattermost-admin-token, property: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: quay-push-rhdh, namespace: haveniq }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: SecretStore, name: upstreambeat-store }
  target:
    name: quay-push-rhdh
    creationPolicy: Owner
    template: { type: kubernetes.io/dockerconfigjson }
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: quay-push-rhdh, property: .dockerconfigjson }
---
# the grants in the SOURCE namespaces (this Application may deploy to them: see the AppProject)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: haveniq-secret-mirror, namespace: agent-office }
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [model-desk-agent-key, mattermost-admin-token]
    verbs: [get]
  - apiGroups: ["authorization.k8s.io"]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: haveniq-secret-mirror, namespace: agent-office }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: haveniq-secret-mirror }
subjects: [{ kind: ServiceAccount, name: secret-mirror, namespace: haveniq }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: haveniq-secret-mirror, namespace: upstreambeat }
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [quay-push-rhdh]
    verbs: [get]
  - apiGroups: ["authorization.k8s.io"]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: haveniq-secret-mirror, namespace: upstreambeat }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: haveniq-secret-mirror }
subjects: [{ kind: ServiceAccount, name: secret-mirror, namespace: haveniq }]
---
# The Zammad API token: created by a human in Zammad (Profile → Token Access) and written to Vault once.
#   oc exec -n vault vault-0 -- vault kv put agent-office/haveniq-zammad ZAMMAD_TOKEN=<token>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: zammad-api-token, namespace: haveniq }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-cluster }
  target: { name: zammad-api-token, creationPolicy: Owner }
  data:
    - secretKey: ZAMMAD_TOKEN
      remoteRef: { key: haveniq-zammad, property: ZAMMAD_TOKEN }
