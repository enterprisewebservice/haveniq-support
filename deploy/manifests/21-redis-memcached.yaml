# Zammad's Redis (ActionCable/websocket fan-out) and memcached (Rails cache). Redis is the Red Hat
# rhel9 image OpenShift GitOps itself runs on; memcached is the upstream image (no auth, in-namespace only).
# Zammad always authenticates to Redis, so Redis gets a password: generated by External Secrets, read by
# both the Redis container (REDIS_PASSWORD) and the chart (secrets.redis.useExisting -> redis-pass).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: { name: zammad-redis-pass, namespace: haveniq }
spec: { length: 32, digits: 8, symbols: 0, symbolCharacters: "", noUpper: false, allowRepeat: true }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: redis-pass, namespace: haveniq }
spec:
  refreshInterval: "0"
  target:
    name: redis-pass
    creationPolicy: Owner
    template:
      data:
        redis-password: "{{ .password }}"
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: zammad-redis-pass } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-redis
  namespace: haveniq
  labels: { app.kubernetes.io/name: zammad-redis, app.kubernetes.io/part-of: haveniq-support }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: zammad-redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: zammad-redis } }
    spec:
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:latest
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-pass, key: redis-password } }
          ports: [{ containerPort: 6379, name: redis }]
          readinessProbe: { exec: { command: [sh, -c, "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"] }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/redis/data }]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: zammad-redis, namespace: haveniq }
spec:
  selector: { app.kubernetes.io/name: zammad-redis }
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-memcached
  namespace: haveniq
  labels: { app.kubernetes.io/name: zammad-memcached, app.kubernetes.io/part-of: haveniq-support }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: zammad-memcached } }
  template:
    metadata: { labels: { app.kubernetes.io/name: zammad-memcached } }
    spec:
      containers:
        - name: memcached
          image: docker.io/library/memcached:1.6-alpine
          args: ["-m", "256"]
          ports: [{ containerPort: 11211, name: memcached }]
          readinessProbe: { tcpSocket: { port: 11211 }, initialDelaySeconds: 3, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 320Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: zammad-memcached, namespace: haveniq }
spec:
  selector: { app.kubernetes.io/name: zammad-memcached }
  ports: [{ name: memcached, port: 11211, targetPort: 11211 }]
