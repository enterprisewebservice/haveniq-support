# The voice worker's identity at the platform's MCP gateway. Authorino matches the bearer the worker
# presents against Secrets carrying this label; the annotations say who it is and which registered
# servers it may call. The key itself is GENERATED by External Secrets (Password generator) — it is never
# typed by a human and never passes through git or a chat.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: haveniq-voice-caller-key
  namespace: haveniq
spec:
  length: 48
  digits: 10
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: haveniq-voice-caller
  namespace: haveniq
spec:
  refreshInterval: "0"          # generate once; a rotation is a deliberate re-run
  target:
    name: haveniq-voice-caller
    creationPolicy: Owner
    template:
      metadata:
        labels:
          agentoffice.ai/mcp-gateway-caller: "true"
          authorino.kuadrant.io/managed-by: authorino
        annotations:
          agentoffice.ai/mcp-caller: haveniq-voice
          agentoffice.ai/mcp-namespace: haveniq
          agentoffice.ai/mcp-servers: "agent-office/haveniq-cloud,agent-office/haveniq-crm"
      data:
        api_key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: haveniq-voice-caller-key
