# LiveKit Cloud credentials for the HavenIQ voice agent (project "haven"). The values live in Vault
# (KV v2 mount `agent-office`, path `haveniq-livekit`), written once by a human; ESO renders them into
# Secret `livekit-credentials`. Nothing secret lives in git.
#
#   oc exec -n vault vault-0 -- vault kv put agent-office/haveniq-livekit \
#       LIVEKIT_URL=wss://haven-3fhqakks.livekit.cloud LIVEKIT_API_KEY=<key> LIVEKIT_API_SECRET=<secret>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: livekit-credentials
  namespace: haveniq
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-cluster }
  target: { name: livekit-credentials, creationPolicy: Owner }
  data:
    - secretKey: LIVEKIT_URL
      remoteRef: { key: haveniq-livekit, property: LIVEKIT_URL }
    - secretKey: LIVEKIT_API_KEY
      remoteRef: { key: haveniq-livekit, property: LIVEKIT_API_KEY }
    - secretKey: LIVEKIT_API_SECRET
      remoteRef: { key: haveniq-livekit, property: LIVEKIT_API_SECRET }
