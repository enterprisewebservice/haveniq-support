# A brain route made for the case worker (retired 19 Nov 2026; the route stays). See the description inside; the
# guardrails front door stays the route for people.
#
# NOT synced by Argo, applied by hand like deploy/argo/haveniq.yaml:  oc apply -f deploy/cluster-scoped/
# ModelConnection is a cluster-wide kind and the Argo project `haveniq` may only create namespaced objects (plus its
# own Namespace). While this file sat in deploy/manifests, Argo refused the WHOLE application ("resource
# agentoffice.ai:ModelConnection is not permitted in project haveniq") and nothing in that folder synced from
# 13 Sep to 19 Nov 2026.
apiVersion: agentoffice.ai/v1alpha1
kind: ModelConnection
metadata:
  name: claude-direct
spec:
  access:
    groups:
    - redhat-attendees
    - redhat-workshop-users
    - model-admins
    users:
    - deanpeterson
  api: openai-completions
  apiKeySecretRef:
    key: api-key
    name: model-desk-agent-key
    namespace: agent-office
  baseUrl: http://model-desk.model-desk.svc.cluster.local:4000/v1
  description: 'Same models and key as claude-work, straight to the model desk: for
    platform agents whose runtime sends structured message content the guardrails
    orchestrator rejects (422 ''Detection on array is not supported''). Human-facing
    chat keeps the guardrailed route.'
  displayName: Claude, direct to the model desk
  keyStrategy: shared
  kind: endpoint
  models:
  - id: claude-sonnet-5
    name: Claude Sonnet 5
  - id: claude-opus-4-6
    name: Claude Opus 4.6
  - id: claude-sonnet-4-5
    name: Claude Sonnet 4.5
  - id: claude-haiku-4-5
    name: Claude Haiku 4.5
